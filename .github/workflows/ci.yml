name: CI

# hearth had no test CI at all: PRs #1-#3 were merged on the strength of
# whoever remembered to run `bun test` locally. #3 was the consumer permission
# broker — token verification and per-source gating — which is the last thing
# that should rely on someone remembering.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test · ${{ matrix.os }}
    strategy:
      # Let both finish so a platform-specific failure is visible at a glance
      # rather than hidden behind whichever runner failed first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # examples/source-files is a separate package with its own dependencies
      # (officeparser et al) and its own tests, which `bun test` at the root
      # collects regardless. Without this install those 28 tests do not merely
      # get skipped — they fail to load, and the run reports 6 failures that
      # look like broken code.
      - name: Install example package deps
        run: bun install --frozen-lockfile
        working-directory: examples/source-files

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck
